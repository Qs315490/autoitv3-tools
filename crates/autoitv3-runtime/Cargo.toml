[package]
name = "autoitv3-runtime"
version.workspace = true
edition.workspace = true
description.workspace = true

[dependencies]
autoitv3-i18n = { path = "../autoitv3-i18n" }
autoitv3-ast = { path = "../autoitv3-ast" }

# AutoIt's StringRegExp* are PCRE; we implement them with the pure-Rust
# `fancy-regex` engine, which covers the backtracking features scripts rely on
# (lookaround, backreferences, atomic groups, conditionals) without a C
# dependency, and stays platform-independent.
fancy-regex = "0.19.2"


[lib]
name = "autoitv3_runtime"
path = "src/lib.rs"

[lints.rust]
unused = "warn"
