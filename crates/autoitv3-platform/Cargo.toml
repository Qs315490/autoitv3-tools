[package]
name = "autoitv3-platform"
version.workspace = true
edition.workspace = true
description.workspace = true

[dependencies]
autoitv3-ast = { path = "../autoitv3-ast" }
autoitv3-gui-model = { path = "../autoitv3-gui-model" }
autoitv3-runtime = { path = "../autoitv3-runtime" }
# Optional GUI renderer: `gui-egui` pulls it (and egui) in.
autoitv3-gui-egui = { path = "../autoitv3-gui-egui", optional = true }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rsa = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Offscreen egui renderer for the GUI model. Off by default so the analysis
# stack never depends on a windowing/font stack.
gui-egui = ["dep:autoitv3-gui-egui", "autoitv3-gui-egui/egui"]

[dev-dependencies]
autoitv3-deobf = { path = "../autoitv3-deobf" }

[lib]
name = "autoitv3_platform"
path = "src/lib.rs"

[lints.rust]
unused = "warn"
