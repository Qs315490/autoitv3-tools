[package]
name = "autoitv3-i18n"
version.workspace = true
edition.workspace = true
description = "Runtime message localisation for the AutoIt v3 toolkit (English + Simplified Chinese)"

[dependencies]

# The Windows UI language, for `auto`: Windows has no `LANG`, so the OS is
# asked instead (see `src/windows_locale.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[lib]
name = "autoitv3_i18n"
path = "src/lib.rs"

[lints.rust]
unused = "warn"
