[package]
name = "au3-cli"
version.workspace = true
edition.workspace = true
description.workspace = true

[dependencies]
autoitv3-ast = { path = "../autoitv3-ast" }
autoitv3-format = { path = "../autoitv3-format" }
autoitv3-runtime = { path = "../autoitv3-runtime" }
autoitv3-deobf = { path = "../autoitv3-deobf" }

# CLI parsing: subcommand aliases + unambiguous abbreviations (`au3 deob`).
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "au3"
path = "src/main.rs"
