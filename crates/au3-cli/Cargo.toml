[package]
name = "au3-cli"
version.workspace = true
edition.workspace = true
description.workspace = true

[dependencies]
autoitv3-ast = { path = "../autoitv3-ast" }
autoitv3-format = { path = "../autoitv3-format" }
autoitv3-runtime = { path = "../autoitv3-runtime" }
autoitv3-platform = { path = "../autoitv3-platform" }
autoitv3-deobf = { path = "../autoitv3-deobf" }
autoitv3-unpack = { path = "../autoitv3-unpack" }
# `au3 run --gui window`: a real window driven by the emulated GUI model.
autoitv3-gui-egui = { path = "../autoitv3-gui-egui", optional = true }

# CLI parsing: subcommand aliases + unambiguous abbreviations (`au3 deob`).
clap = { version = "4.5", features = ["derive"] }

# Tab completion / line editing for the interactive `au3 debug` shell. Only
# used when stdin is a terminal; pipes, `-c` and command files keep the plain
# reader (see `Shell::next_command`).
rustyline = "14"

[features]
default = []
# Enable `au3 run --gui window` (pulls the eframe/winit stack):
#   cargo build --release -p au3-cli --features gui-window
gui-window = [
    "dep:autoitv3-gui-egui",
    "autoitv3-gui-egui/window",
    "autoitv3-platform/gui-window",
]

[[bin]]
name = "au3"
path = "src/main.rs"
